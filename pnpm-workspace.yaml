# pnpm settings only (single-package repo, no `packages:` list).
# Supply-chain hardening for the dev toolchain. Under the `packageManager`
# pin (pnpm 12) an unknown key fails every command but `pnpm config` with
# ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS, so a mistyped key cannot
# silently drop a guarantee. Some values below equal pnpm 12's defaults;
# they stay explicit so the guarantee doesn't hang on a default.

# Don't resolve versions younger than 7 days (minutes). Pairs with the
# Dependabot cooldown in .github/dependabot.yml.
minimumReleaseAge: 10080

# Fail when no version in range is old enough; never fall back to a younger one.
minimumReleaseAgeStrict: true

# Fail on registry metadata without publish times instead of skipping the
# age and trust checks for that package.
minimumReleaseAgeIgnoreMissingTime: false

# Fail the install when a package's trust evidence (trusted publisher /
# provenance) is weaker than an earlier release of the same package.
trustPolicy: no-downgrade

# Only direct dependencies may come from git/tarball URLs.
blockExoticSubdeps: true

# Fail the install when any dependency ships an unreviewed build script.
# No dependency needs one today; if one appears, decide per package with
# an `allowBuilds: { <name>: true|false }` map here.
strictDepBuilds: true
